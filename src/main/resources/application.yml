spring:
  application:
    name: corebanking-ledger
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:corebanking-ledger}
      auto-offset-reset: earliest

logging:
  level:
    org.springframework.kafka: INFO
    org.apache.kafka.clients.consumer: WARN

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  kafka:
    topics:
      posting-transaction: posting.transaction
