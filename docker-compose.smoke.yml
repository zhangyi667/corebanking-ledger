name: corebanking-smoke

# Three services + independent Postgres per stateful service.
# Sized for a 10-CPU / 16-GB Colima VM.

services:
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "6"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1.5G

  postgres-pm:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: posting_manager
      POSTGRES_USER: posting
      POSTGRES_PASSWORD: posting
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posting"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  postgres-acc:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: account_service
      POSTGRES_USER: account
      POSTGRES_PASSWORD: account
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U account"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  account-service:
    build:
      context: ../corebanking-account-service
      dockerfile: Dockerfile
    depends_on:
      postgres-acc:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-acc:5432/account_service
      SPRING_DATASOURCE_USERNAME: account
      SPRING_DATASOURCE_PASSWORD: account
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "50"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
    ports:
      - "8082:8082"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  posting-manager:
    build:
      context: ../corebanking-posting-manager
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      postgres-pm:
        condition: service_healthy
      account-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-pm:5432/posting_manager
      SPRING_DATASOURCE_USERNAME: posting
      SPRING_DATASOURCE_PASSWORD: posting
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTING_ACCOUNTS_BASE_URL: http://account-service:8082
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    ports:
      - "8081:8081"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 1.5G

  corebanking-ledger:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: corebanking-ledger
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
