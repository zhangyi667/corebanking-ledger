apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: corebanking-ledger
  namespace: corebanking
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: corebanking-ledger
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
