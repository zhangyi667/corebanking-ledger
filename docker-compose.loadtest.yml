name: corebanking-loadtest

services:
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "6"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: posting_manager
      POSTGRES_USER: posting
      POSTGRES_PASSWORD: posting
    command: ["postgres", "-c", "max_connections=500", "-c", "shared_buffers=256MB", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all", "-c", "log_min_duration_statement=500"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posting"]
      interval: 5s
      timeout: 3s
      retries: 20

  ledger-mock:
    image: wiremock/wiremock:3.10.0
    volumes:
      - ../corebanking-posting-manager/ops/ledger-mock:/home/wiremock
    command: ["--verbose", "--global-response-templating", "--container-threads", "200", "--jetty-acceptor-threads", "4"]

  posting-manager:
    build:
      context: ../corebanking-posting-manager
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ledger-mock:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/posting_manager
      SPRING_DATASOURCE_USERNAME: posting
      SPRING_DATASOURCE_PASSWORD: posting
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTING_LEDGER_BASE_URL: http://ledger-mock:8080
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -XX:+UnlockDiagnosticVMOptions -XX:+DebugNonSafepoints"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      posting-manager:
        condition: service_started
    volumes:
      - ./nginx-lb.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8081:80"

  corebanking-ledger:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: corebanking-ledger
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:+UseZGC"
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
